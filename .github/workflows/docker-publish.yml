name: CI/CD - Docker Build & Push

on:
  push:
    branches: [ "**" ]
    tags: [ 'v*.*.*', 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Run Unit Tests
        run: go test -v -race ./...

  build-and-push:
    name: Build & Publish Docker
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Prod Metadata: Only for Releases (SemVer)
      - name: Extract Prod Docker metadata
        id: meta-prod
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      # Debug Metadata: Releases (SemVer) + Branches (Full SHA)
      - name: Extract Debug Docker metadata
        id: meta-debug
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/debug
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=long,prefix=

      - name: Debug Tags
        run: |
          echo "Prod Tags:"
          echo "${{ steps.meta-prod.outputs.tags }}"
          echo "Debug Tags:"
          echo "${{ steps.meta-debug.outputs.tags }}"

      - name: Calculate Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/heads/}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.meta-prod.outputs.tags }}
            ${{ steps.meta-debug.outputs.tags }}
          labels: |
            ${{ steps.meta-prod.outputs.labels }}
            ${{ steps.meta-debug.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
